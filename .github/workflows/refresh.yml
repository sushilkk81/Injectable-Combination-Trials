name: Refresh trial data

on:
  schedule:
    - cron: "30 3 * * 1"   # every Monday 03:30 UTC (09:00 IST)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "site/**"
      - "data/curation.json"
      - "data/revenue.json"
      - "data/config.json"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Rebuild page from ClinicalTrials.gov and EU CTIS
        id: build
        run: python scripts/build.py
        continue-on-error: true
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/trials.json data/build-log.txt
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Data refresh $(date -u +%Y-%m-%d) (${{ steps.build.outcome }})"
          git push
      - name: Fail the run if the build failed
        if: steps.build.outcome == 'failure'
        run: |
          cat data/build-log.txt
          exit 1
